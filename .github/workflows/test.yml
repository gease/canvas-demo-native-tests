name: Test canvas-demo builds

# Tests a canvas-demo build from canvas-storybook-ai's GitLab CI on the systems
# GitLab cannot run: macOS (Apple silicon and Intel) and Windows. The build's
# macOS and Windows executables are packed on Linux there, so this is the first
# time they run.
#
# - conformance: drupack's conformance suite, at the engine tag the build used,
#   on each executable (what drupack's own release runs on these runners).
# - install: the drupal-demo-install skill end to end, from the skill's branch,
#   with the build under test, then its status checks, a Storybook restart and
#   a stop. Ubuntu runs too, as the reference.
#
# Nothing here is pushed or published anywhere; failed jobs upload their logs.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_url:
        description: The build's artifact folder (SITE_BUILD_URL), holding the executables and checksums.txt.
        type: string
      skill_ref:
        description: The canvas-storybook-ai branch or tag whose drupal-demo-install skill is tested.
        type: string
      drupack_ref:
        description: The drupack engine tag the build was packed with (its conformance suite).
        type: string

permissions:
  contents: read

env:
  BUILD_URL: ${{ inputs.build_url || 'https://gitlab.com/freelygive/canvas-storybook-ai/-/jobs/17297188984/artifacts/raw/.drupack/dist' }}
  SKILL_REPO: https://gitlab.com/freelygive/canvas-storybook-ai.git
  SKILL_REF: ${{ inputs.skill_ref || 'feat/drupal-demo-install' }}
  DRUPACK_REF: ${{ inputs.drupack_ref || '1.0.0-beta1' }}

jobs:
  conformance:
    name: conformance ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-arm64, runner: macos-15, file: canvas-demo-macos-arm64 }
          - { target: macos-amd64, runner: macos-15-intel, file: canvas-demo-macos-amd64 }
          - { target: windows-amd64, runner: windows-2025, file: canvas-demo-windows-amd64.exe }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tresbientech/drupack
          ref: ${{ env.DRUPACK_REF }}
          path: drupack-engine
          persist-credentials: false

      - name: Download the executable
        env:
          FILE: ${{ matrix.file }}
        run: |
          mkdir dist
          curl -fsSL --retry 3 -o dist/checksums.txt "$BUILD_URL/checksums.txt"
          curl -fsSL --retry 3 -o dist/site.json "$BUILD_URL/site.json"
          curl -fsSL --retry 3 -o "dist/$FILE" "$BUILD_URL/$FILE"
          expected=$(awk -v f="$FILE" '$2 == f {print $1}' dist/checksums.txt)
          if command -v sha256sum >/dev/null; then actual=$(sha256sum "dist/$FILE" | cut -d ' ' -f 1); else actual=$(shasum -a 256 "dist/$FILE" | cut -d ' ' -f 1); fi
          echo "$FILE: SHA-256 $actual, checksums.txt lists $expected"
          [ -n "$expected" ] && [ "$actual" = "$expected" ]
          chmod +x "dist/$FILE"
          "dist/$FILE" --version

      # What drupack's release checks: a downloaded, unsigned macOS file starts
      # once the quarantine flag a browser sets is removed. curl sets none.
      - name: Check the unsigned launch steps
        if: runner.os == 'macOS'
        env:
          FILE: ${{ matrix.file }}
        run: |
          mkdir -p test-results
          cp "dist/$FILE" test-results/quarantined
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;" test-results/quarantined
          xattr -d com.apple.quarantine test-results/quarantined
          test-results/quarantined --help > /dev/null

      - name: Run the conformance suite
        env:
          FILE: ${{ matrix.file }}
        run: |
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          "$python" drupack-engine/tests/conformance "dist/$FILE" test-results/conformance

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-${{ matrix.target }}
          path: test-results
          if-no-files-found: ignore

  # Storybook of the component project on Windows (rounds 1-4): two bugs.
  # vite-tsconfig-paths 6.0.5 runs it out of memory (removing it is the only
  # fix), and without it @/components/<name> does not resolve, because
  # @freelygive/canvas-utils 0.7.0 compares Vite's forward-slash module paths
  # with its backslash components folder. Round 5 applies both fixes (the
  # canvas-utils one as a patch of its dist file) and renders every story in
  # Chromium on Windows and Linux.
  storybook-browser:
    name: storybook browser both-fixes ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0

      - name: Get the component project
        run: |
          git clone -q --depth 1 --branch "$SKILL_REF" "$SKILL_REPO" project
          git -C project log -1 --format='Project at %h %s'

      - name: Install the npm packages and Chromium
        working-directory: project
        run: |
          npm ci --no-audit --no-fund > ../npm-ci.log 2>&1 || { tail -n 40 ../npm-ci.log; exit 1; }
          deps=; [ "$RUNNER_OS" = Linux ] && deps=--with-deps
          npx playwright install $deps chromium > ../playwright.log 2>&1 || { tail -n 40 ../playwright.log; exit 1; }

      - name: Remove vite-tsconfig-paths from the Storybook config
        working-directory: project
        run: |
          py=python3; python3 -c 1 2>/dev/null || py=python
          "$py" - <<'PY'
          path = ".storybook/main.ts"
          s = open(path).read()
          plugin = "      tsconfigPaths({\n        root: path.resolve(__dirname, '..'),\n      }),\n"
          assert plugin in s, "the tsconfigPaths call is not in main.ts"
          s = s.replace(plugin, "").replace("import tsconfigPaths from 'vite-tsconfig-paths';\n", "")
          open(path, "w").write(s)
          PY
          git diff .storybook/main.ts

      # The fix proposed for canvas-utils' src/vite-storybook.ts: compare module
      # paths with the components folder in forward-slash form as well. On
      # Linux both forms are the same, so nothing changes there.
      - name: Patch canvas-utils to compare paths with forward slashes
        working-directory: project
        run: |
          py=python3; python3 -c 1 2>/dev/null || py=python
          "$py" - <<'PY'
          path = "node_modules/@freelygive/canvas-utils/dist/vite-storybook.js"
          s = open(path, encoding="utf-8").read()
          edits = [
              ('  const dir = resolveComponentsDir(opts.componentsDir);\n',
               '  const dir = resolveComponentsDir(opts.componentsDir);\n  const posixDir = dir.split(path3.sep).join("/");\n'),
              ('      } else if (source.startsWith(dir + path3.sep)) {',
               '      } else if (source.startsWith(dir + path3.sep) || source.startsWith(posixDir + "/")) {'),
              ('      return entryMap.get(name) ?? null;',
               '      const entry = entryMap.get(name);\n      return entry ? entry.split(path3.sep).join("/") : null;'),
              ('      if (id.startsWith(dir) && (id.endsWith(".component.yml")',
               '      if ((id.startsWith(dir) || id.startsWith(posixDir)) && (id.endsWith(".component.yml")'),
              ('  const dir = resolveComponentsDir(componentsDir);\n  return {\n    name: "storybook-component-css",',
               '  const dir = resolveComponentsDir(componentsDir);\n  const posixDir = dir.split(path3.sep).join("/");\n  return {\n    name: "storybook-component-css",'),
              ('      if (!id.startsWith(dir)) return;',
               '      if (!id.startsWith(dir) && !id.startsWith(posixDir)) return;'),
          ]
          for old, new in edits:
              assert s.count(old) == 1, f"not found once in {path}: {old!r}"
              s = s.replace(old, new)
          open(path, "w", encoding="utf-8").write(s)
          print(f"{len(edits)} edits applied to {path}")
          PY

      - name: Render every story in Chromium
        working-directory: project
        run: |
          annotate() {
            local text="$3"; text="${text//'%'/'%25'}"; text="${text//$'\r'/}"; text="${text//$'\n'/'%0A'}"
            echo "::$1 title=$2::$text"
          }
          node node_modules/storybook/dist/bin/dispatcher.js dev -p 6007 --host 127.0.0.1 --no-open --ci > ../storybook.log 2>&1 &
          start=$SECONDS; code=000
          while [ $((SECONDS - start)) -lt 300 ]; do
            code=$(curl -s -o ../index.json -w '%{http_code}' --max-time 20 http://127.0.0.1:6007/index.json || true)
            [ "$code" = 200 ] && break
            grep -q 'heap out of memory' ../storybook.log && break
            sleep 5
          done
          echo "index.json $code after $((SECONDS - start))s"
          # In the project, so require('playwright') finds the project's copy.
          cat > render.cjs <<'JS'
          // Opens each story's preview page and waits for Storybook to mark the
          // body: sb-show-main (rendered), sb-show-errordisplay (error screen).
          const fs = require('node:fs');
          const { chromium } = require('playwright');
          const base = 'http://127.0.0.1:6007';
          (async () => {
            const index = JSON.parse(fs.readFileSync('../index.json', 'utf8'));
            const stories = Object.values(index.entries).filter((e) => e.type === 'story');
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', (e) => errors.push(String(e.message || e)));
            const render = async (story) => {
              errors.length = 0;
              await page.goto(`${base}/iframe.html?id=${story.id}&viewMode=story`, { waitUntil: 'domcontentloaded' });
              await page.waitForFunction(
                () => /sb-show-(main|errordisplay|nopreview)/.test(document.body.className),
                null, { timeout: 60000 });
              // The body can carry the class of the previous phase too, so the outcome wins.
              const state = await page.evaluate(() => {
                const c = document.body.className;
                return /sb-show-errordisplay/.test(c) ? 'errordisplay'
                  : /sb-show-main/.test(c) ? 'main'
                  : /sb-show-nopreview/.test(c) ? 'nopreview' : 'preparing';
              });
              const message = state === 'main' ? '' : await page.evaluate(() =>
                [document.querySelector('#error-message'), document.querySelector('#error-stack')]
                  .map((n) => (n ? n.textContent.trim() : '')).join(' | ').slice(0, 400));
              return { state, message };
            };
            let rendered = 0;
            const failed = [];
            for (const story of stories) {
              let result;
              // The first visits can meet Vite's dependency optimisation reload.
              for (let attempt = 1; attempt <= 2; attempt++) {
                try { result = await render(story); } catch (e) { result = { state: 'timeout', message: String(e.message).split('\n')[0] }; }
                if (result.state === 'main') break;
              }
              if (result.state === 'main') rendered++;
              else failed.push(`${story.id} (${story.importPath}): ${result.state} ${result.message} ${errors.slice(0, 2).join(' / ')}`.slice(0, 600));
            }
            console.log(`${rendered}/${stories.length} stories rendered`);
            for (const line of failed.slice(0, 20)) console.log(`  FAILED ${line}`);
            await browser.close();
            process.exit(failed.length ? 1 : 0);
          })().catch((e) => { console.log(`render script failed: ${e.message}`); process.exit(2); });
          JS
          status=0; out="index.json $code"
          if [ "$code" = 200 ]; then
            out=$(node render.cjs 2>&1) || status=$?
          else
            status=1
          fi
          echo "$out"
          echo "--- end of storybook.log"; tail -n 30 ../storybook.log
          annotate notice "RESULT both-fixes $RUNNER_OS" "$(printf 'index.json %s after %ss\n%s' "$code" "$((SECONDS - start))" "$out")"
          annotate notice "storybook.log both-fixes $RUNNER_OS" "$(tail -n 25 ../storybook.log | cut -c1-300)"
          if [ "$RUNNER_OS" = Windows ]; then taskkill //F //IM node.exe > /dev/null 2>&1 || true; else pkill -f dispatcher.js || true; fi
          exit $status

  install:
    name: install ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
    defaults:
      run:
        # On Windows, Git Bash: the shell the skill's scripts run in there.
        shell: bash
    steps:
      - name: Get the skill
        run: |
          git clone -q --depth 1 --branch "$SKILL_REF" "$SKILL_REPO" skill-repo
          git -C skill-repo log -1 --format='Skill at %h %s'
          echo "SKILL=$PWD/skill-repo/skills/drupal-demo-install" >> "$GITHUB_ENV"
          # The install folder in Git Bash's form on Windows (/d/a/_temp/demo).
          dir="$RUNNER_TEMP/demo"
          if [ "$RUNNER_OS" = Windows ]; then dir="$(cygpath -u "$dir")"; fi
          echo "DEMO=$dir" >> "$GITHUB_ENV"

      - name: Show the plan
        run: bash "$SKILL/scripts/install.sh" --dir "$DEMO" --plan

      - name: Install
        env:
          SITE_BUILD_URL: ${{ env.BUILD_URL }}
        run: bash "$SKILL/scripts/install.sh" --dir "$DEMO"

      # A step of its own: the site and Storybook must outlive the command that
      # started them, as they must outlive a Claude Code shell command.
      - name: Check the install from a new shell
        run: bash "$SKILL/scripts/check.sh" --dir "$DEMO"

      # The SKILL.md rule for Claude Code on Windows when its shell is
      # PowerShell: find Git's bash.exe from git and run the scripts with it.
      - name: Check the install from PowerShell, through Git's bash.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitBash = Join-Path (Split-Path (Split-Path (Split-Path (git --exec-path)))) 'bin\bash.exe'
          Write-Output "Git's bash: $gitBash"
          & $gitBash "$env:SKILL/scripts/check.sh" --dir ($env:RUNNER_TEMP + '\demo')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restart Storybook with the workspace's command
        working-directory: ${{ runner.temp }}/demo/migration
        run: |
          bash ../.drupal-demo/bin/storybook.sh stop
          if bash ../.drupal-demo/bin/storybook.sh status; then echo "Storybook still runs after stop." >&2; exit 1; fi
          bash ../.drupal-demo/bin/storybook.sh start
          bash ../.drupal-demo/bin/storybook.sh status

      - name: Run the hand-over report
        run: bash "$SKILL/scripts/report.sh" --dir "$DEMO" | sed 's#/user/reset/[^ ]*#/user/reset/(one-time link)#'

      - name: Stop the site and Storybook
        run: |
          bash "$SKILL/scripts/stop.sh" --dir "$DEMO"
          sleep 5
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$1" || true; }
          [ "$(code http://localhost:7225/)" = 000 ] || { echo "The site still answers after stop." >&2; exit 1; }
          [ "$(code http://127.0.0.1:6007/index.json)" = 000 ] || { echo "Storybook still answers after stop." >&2; exit 1; }
          echo "Both stopped."

      # What npm reads in the component project, and Storybook's own logs, in
      # the job output: the uploaded logs need a GitHub login to read.
      - name: Show Storybook diagnostics
        if: failure()
        working-directory: ${{ runner.temp }}/demo/storybook
        run: |
          site=../canvas-demo; [ "$RUNNER_OS" = Windows ] && site=../canvas-demo.exe
          echo "--- .npmrc"; cat .npmrc 2>/dev/null || echo "(none)"
          echo "--- npm config get script-shell"; "$site" npm config get script-shell || true
          echo "--- npm config list"; "$site" npm config list || true
          echo "--- npm prefix (the project npm sees)"; "$site" npm prefix || true
          for log in storybook.log storybook.err.log; do
            [ -f "$log" ] && { echo "--- $log"; tail -n 40 "$log"; }
          done
          true

      - name: Upload the install logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: install-logs-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/demo/.drupal-demo/logs
            ${{ runner.temp }}/demo/storybook/storybook*.log
            ${{ runner.temp }}/demo/data/logs
          if-no-files-found: ignore
